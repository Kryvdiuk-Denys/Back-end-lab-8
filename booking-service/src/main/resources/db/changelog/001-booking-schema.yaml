databaseChangeLog:
  - changeSet:
      id: booking-001-create-booking
      author: coworking
      changes:
        - createTable:
            tableName: booking
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_booking
                    nullable: false
              - column:
                  name: workspace_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: workspace_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: customer_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: customer_email
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: starts_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: ends_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: CONFIRMED
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: booking
            indexName: ix_booking_workspace_id
            columns:
              - column:
                  name: workspace_id
        - createIndex:
            tableName: booking
            indexName: ix_booking_starts_at
            columns:
              - column:
                  name: starts_at
        - insert:
            tableName: booking
            columns:
              - column:
                  name: workspace_id
                  valueNumeric: 1
              - column:
                  name: workspace_name
                  value: Focus Desk A1
              - column:
                  name: customer_name
                  value: Demo User
              - column:
                  name: customer_email
                  value: demo@coworking.local
              - column:
                  name: starts_at
                  valueDate: 2026-09-18T10:00:00
              - column:
                  name: ends_at
                  valueDate: 2026-09-18T12:00:00
              - column:
                  name: status
                  value: CONFIRMED
              - column:
                  name: total_price
                  valueNumeric: 240.00
